<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover"
      name="viewport"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ner" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <meta name="format-detection" content="telephone=no" />
    <title>Ner</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background-color: #000;
      }
      .game {
        position: absolute;
        top: 0;
        left: 0;
        margin: 0;
        border: 0;
        width: 100%;
        height: 100%;
        width: 100dvw;
        height: 100dvh;
        overflow: hidden;
        touch-action: none;
        display: block;
        image-rendering: optimizeSpeed;
        image-rendering: -moz-crisp-edges;
        image-rendering: -o-crisp-edges;
        image-rendering: -webkit-optimize-contrast;
        image-rendering: optimize-contrast;
        image-rendering: crisp-edges;
        image-rendering: pixelated;
        -ms-interpolation-mode: nearest-neighbor;
      }
    </style>
  </head>
  <body>
    <canvas class="game" id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    <script>
      var Module = {
        preRun: [],
        postRun: [],
        print: function (o) {
          (o = Array.prototype.slice.call(arguments).join(" ")), console.log(o);
        },
        printErr: function (o) {
          (o = Array.prototype.slice.call(arguments).join(" ")), console.error(o);
        },
        canvas: document.getElementById("canvas"),
        setStatus: function (o) {
          console.log("status: " + o);
        },
        monitorRunDependencies: function (o) {
          console.log("monitor run deps: " + o);
        },
      };
      // Safari's toolbar can resize dvh without a window resize event. Notify
      // Sokol when the actual canvas CSS size changes so its backing buffer,
      // projection and touch coordinates continue to match the visible area.
      if (window.ResizeObserver) {
        let width = 0, height = 0, pending = false;
        new ResizeObserver(function () {
          const rect = Module.canvas.getBoundingClientRect();
          const nextWidth = Math.round(rect.width), nextHeight = Math.round(rect.height);
          if (nextWidth === width && nextHeight === height) return;
          width = nextWidth; height = nextHeight;
          if (!pending) {
            pending = true;
            requestAnimationFrame(function () {
              pending = false;
              window.dispatchEvent(new Event('resize'));
            });
          }
        }).observe(Module.canvas);
      }
      window.onerror = function () {
        console.log("onerror: " + event.message);
      };
    </script>
    <script async src="iteration-sapp.js"></script>
  </body>
</html>
